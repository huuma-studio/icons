name: ci
run-name: change request by ${{ github.actor }}
on:
  pull_request:
  # Publish runs the same checks before it releases.
  workflow_call:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          node-version: "24"
          cache: true
      # Format, lint and type check.
      - run: vp check
      # isolatedDeclarations errors (TS9037 and others), which `vp check`
      # doesn't report.
      - run: vp exec tsc -p .
      # Catches JSR publish errors (slow types, missing exports) before merge.
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - run: vp run jsr:dry-run
